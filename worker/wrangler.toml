name = "vraj-naturals-payments"
main = "src/index.js"
compatibility_date = "2026-10-16"

# Local secrets belong in worker/.dev.vars. Test mode is the default.
# The production environment has a same-origin /api/* route and stays disabled
# until all production secrets have been added and PAYMENTS_ENABLED is set true.

[env.production]
routes = [
  { pattern = "vrajnaturals.com/api/*", zone_name = "vrajnaturals.com" }
]

[env.production.vars]
ALLOWED_ORIGIN = "https://vrajnaturals.com"
ORDERS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzJ1VcZegy4luW9U-aebWS4Yo3V6T6_JajdlyVEtwZy9ew01hvkOBSGMapolpgYfsL0/exec"
RAZORPAY_MODE = "live"
PAYMENTS_ENABLED = "false"
