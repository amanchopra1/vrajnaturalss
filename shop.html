<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore the Vraj Naturals collection of Indian food staples and thoughtfully chosen handicrafts.">
  <title>Shop | Vraj Naturals</title>
  <link rel="icon" type="image/webp" href="/images/vraj-naturals-logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<body><header data-site-header></header><main>
  <section class="page-hero"><p class="eyebrow">THE VRAJ COLLECTION</p><h1>Shop <em>thoughtfully.</em></h1><p>Everyday staples and considered pieces for the way you live.</p></section>

    <p class="small-note">Prices shown are regular shop rates per kg. Choose a 1, 2, 5 or 10 kg pack to see its price, then select the number of packs for your total.</p>
  </section>
